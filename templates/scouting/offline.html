<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#198754">
  <title>PUCERON - Mode hors ligne</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f8f5;
      color: #123d2a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background:
        radial-gradient(circle at top left, rgba(25, 135, 84, 0.12), transparent 36%),
        #f4f8f5;
    }
    main {
      width: min(100%, 520px);
      padding: 2rem;
      border: 1px solid #cfe3d6;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 20px 50px rgba(16, 79, 49, 0.12);
    }
    .eyebrow {
      margin: 0 0 0.65rem;
      color: #198754;
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 7vw, 2.7rem); }
    p { line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    button {
      min-height: 44px;
      padding: 0.7rem 1rem;
      border: 1px solid #198754;
      border-radius: 12px;
      background: #198754;
      color: #fff;
      font: 700 0.95rem Arial, sans-serif;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: #146c43; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PUCERON</p>
    <h1>Connexion indisponible</h1>
    <p>Le serveur n’est pas joignable. Si une saisie était ouverte, son brouillon reste enregistré sur ce téléphone.</p>
    <p>Revenez à l’écran précédent ou réessayez lorsque la connexion est rétablie.</p>
    <div class="actions">
      <button type="button" onclick="history.back()">Écran précédent</button>
      <button type="button" class="secondary" onclick="location.reload()">Réessayer</button>
    </div>
  </main>
</body>
</html>
