{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Connexion</h1>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Identifiant</label>
            <input type="text" name="username" autofocus required id="id_username" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Mot de passe</label>
            <input type="password" name="password" required id="id_password" class="form-control">
          </div>
          <div class="mb-3 text-end">
            <a href="{% url 'password_reset' %}" class="small">Mot de passe oublié ?</a>
          </div>
          <button class="btn btn-success w-100" type="submit">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
