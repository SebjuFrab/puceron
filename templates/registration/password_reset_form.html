{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-2">Mot de passe oublie</h1>
        <p class="text-muted mb-3">Saisissez votre email. Vous recevrez un lien pour definir un nouveau mot de passe.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_email">Email</label>
            <input type="email" name="email" autocomplete="email" required id="id_email" class="form-control">
          </div>
          {% if form.errors %}
            <div class="text-danger small mb-3">{{ form.errors }}</div>
          {% endif %}
          <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Envoyer le lien</button>
            <a class="btn btn-outline-secondary" href="{% url 'login' %}">Retour</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
